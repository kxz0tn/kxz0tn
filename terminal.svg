<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 720" width="920" height="720" role="img" aria-label="kxz0tn terminal">
  <defs>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#ffffff" opacity="0.035"/>
    </pattern>
    <linearGradient id="vignette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0.35"/>
      <stop offset="18%" stop-color="#000" stop-opacity="0"/>
      <stop offset="82%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.45"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .t { font-family: "IBM Plex Mono", "Share Tech Mono", "Courier New", ui-monospace, monospace; }
      .dim { fill: #8a8a8a; }
      .fg { fill: #f2f2f2; }
      .mute { fill: #5c5c5c; }
    </style>
  </defs>

  <rect width="920" height="720" fill="#050505"/>
  <rect x="18" y="18" width="884" height="684" fill="#000" stroke="#e6e6e6" stroke-width="1.25"/>
  <rect x="26" y="26" width="868" height="668" fill="none" stroke="#2a2a2a" stroke-width="1"/>

  <rect x="26" y="26" width="868" height="36" fill="#0d0d0d"/>
  <text class="t fg" x="42" y="50" font-size="13" letter-spacing="3">TERMINAL</text>
  <text class="t dim" x="160" y="50" font-size="13" letter-spacing="2">kxz0tn</text>
  <circle cx="848" cy="44" r="4" fill="#f2f2f2">
    <animate attributeName="opacity" values="1;0.15;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text class="t fg" x="800" y="50" font-size="12" letter-spacing="2">LIVE</text>

  <g filter="url(#glow)">
    <text class="t mute" x="48" y="96" font-size="12" letter-spacing="3">SYS.READY</text>
    <text class="t mute" x="720" y="96" font-size="12" letter-spacing="2">LINK OK</text>

    <text class="t fg" x="48" y="140" font-size="15">$</text>
    <text class="t fg" x="68" y="140" font-size="15">whoami</text>
    <text class="t fg" x="48" y="166" font-size="15">kxz0tn</text>

    <text class="t fg" x="48" y="210" font-size="15">$</text>
    <text class="t fg" x="68" y="210" font-size="15">cat BIO</text>
    <text class="t fg" x="48" y="236" font-size="15">Spaceship! | Cross-universe travel</text>

    <text class="t fg" x="48" y="280" font-size="15">$</text>
    <text class="t fg" x="68" y="280" font-size="15">ls</text>

    <text class="t mute" x="48" y="312" font-size="13" letter-spacing="1">NAME                    TYPE</text>
    <text class="t fg" x="48" y="340" font-size="14">zortex</text>
    <text class="t dim" x="280" y="340" font-size="14">inertial space survival</text>
    <text class="t fg" x="48" y="366" font-size="14">hyperspace-portal</text>
    <text class="t dim" x="280" y="366" font-size="14">wormhole control deck</text>
    <text class="t fg" x="48" y="392" font-size="14">cipher</text>
    <text class="t dim" x="280" y="392" font-size="14">arena sport</text>
    <text class="t fg" x="48" y="418" font-size="14">xenocoil</text>
    <text class="t dim" x="280" y="418" font-size="14">arcade core</text>
    <text class="t fg" x="48" y="444" font-size="14">void-runner</text>
    <text class="t dim" x="280" y="444" font-size="14">lunar survival</text>
    <text class="t fg" x="48" y="470" font-size="14">basebreaker</text>
    <text class="t dim" x="280" y="470" font-size="14">endless runner</text>
    <text class="t fg" x="48" y="496" font-size="14">neural-forge</text>
    <text class="t dim" x="280" y="496" font-size="14">electronics lab</text>
    <text class="t fg" x="48" y="522" font-size="14">aetheris</text>
    <text class="t dim" x="280" y="522" font-size="14">research terminal</text>
    <text class="t fg" x="48" y="548" font-size="14">high-trace</text>
    <text class="t dim" x="280" y="548" font-size="14">sky instrument</text>

    <text class="t fg" x="48" y="600" font-size="15">$</text>
    <rect x="68" y="586" width="10" height="16" fill="#f2f2f2">
      <animate attributeName="opacity" values="1;0;1" dur="1.05s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="26" y="26" width="868" height="668" fill="url(#scan)" pointer-events="none"/>
  <rect x="26" y="26" width="868" height="668" fill="url(#vignette)" pointer-events="none"/>

  <path d="M26 50 V26 H50" fill="none" stroke="#fff" stroke-width="1.5"/>
  <path d="M894 50 V26 H870" fill="none" stroke="#fff" stroke-width="1.5"/>
  <path d="M26 670 V694 H50" fill="none" stroke="#fff" stroke-width="1.5"/>
  <path d="M894 670 V694 H870" fill="none" stroke="#fff" stroke-width="1.5"/>
